# Build the software/PC Windows application (UniSolder.exe)

name: Windows Unisolder application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    # Build the whole solution in Release (includes SSComm and SSControl)
    - name: Build with MSBuild
      working-directory: software/PC
      run: msbuild UniSolder.sln /p:Configuration=Release /p:Platform="Any CPU" /p:SignManifests=false /t:Rebuild
    # Archive the built application (UniSolder.exe and its DLLs)
    - name: Archive build
      uses: actions/upload-artifact@v4
      with:
        name: Unisolder-WindowsApp
        path: software/PC/UniSolder/bin/Release
        if-no-files-found: error
