# Build the software/PC application with the .NET 10 SDK (SDK-style projects)

name: Windows Unisolder application (.NET 10)

on:
  workflow_dispatch:
  # builds of other branches than stable start by themselves and are published as a pre-release
  push:
    branches-ignore:
      - stable
    paths:
      - 'software/PC/**'
      - '.github/workflows/build-windows-dotnet10.yaml'

permissions:
  contents: write   # to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # Restore NuGet packages and publish a self-contained single-file exe
    # (runs on Windows x64 without installing the .NET runtime)
    - name: Publish with dotnet
      working-directory: software/PC
      run: >
        dotnet publish UniSolder/UniSolder.csproj
        -c Release -r win-x64 --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:EnableCompressionInSingleFile=true
        -o publish
    # Archive the build
    - name: Archive build
      uses: actions/upload-artifact@v4
      with:
        name: Unisolder-WindowsApp-net10
        path: software/PC/publish
        if-no-files-found: error
    # Pre-release with the whole publish folder as a zip, so it can be downloaded without a GitHub login
    # (not for stable: those are released by hand)
    - name: Publish pre-release
      if: github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="win-$(date -u +%Y%m%d-%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
        ls -la software/PC/publish | head -50
        pwsh -Command "Compress-Archive -Path software/PC/publish/* -DestinationPath UniSolder-windows-$tag.zip"
        gh release create "$tag" "UniSolder-windows-$tag.zip" --prerelease \
          --title "Windows app $tag" \
          --notes "Windows app built from commit $GITHUB_SHA on ${GITHUB_REF_NAME}. Unzip and run UniSolder.exe on Windows x64 (.NET is included)." \
          --target "$GITHUB_SHA"
