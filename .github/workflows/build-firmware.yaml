name: Build Unisolder firmware
on: 
  workflow_dispatch:

permissions:
  contents: write   # to publish the release

jobs:
  build:
    name: Build project PIC32_with_bootloader
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Dump current directory
        run: |
          echo ${{ github.workspace }}
      - name: Change directory
        run: cd software/front
      # Currently, only PIC32_with_bootloader is building on Linux
      - name: Build PIC32_with_bootloader
        uses: PBrunot/ghactions-mplabx@master
        with:
          project: software/front/US_Firmware.X
          configuration: PIC32_with_bootloader
      # Print the memory use of the build (from the linker map) as a notice on the run
      - name: Memory usage
        continue-on-error: true
        run: |
          map=$(ls software/front/US_Firmware.X/dist/PIC32_with_bootloader/production/*.map | head -n 1)
          echo "map file: $map"
          grep -n -i -A14 "Memory Usage Report" "$map" | head -40 || true
          grep -i "memory used\|data memory\|program memory" "$map" | head -12 | while read -r l; do echo "::notice title=memory::$l"; done
      # Archive the build output
      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: PIC32_with_bootloader
          path: ${{ github.workspace }}/software/front/US_Firmware.X/dist/PIC32_with_bootloader/production
          if-no-files-found: error
      # Builds of the default branch are also published as a GitHub Release with the .hex to flash
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=software/front/US_Firmware.X/dist/PIC32_with_bootloader/production
          hex=$(ls $dir/*.hex | head -n 1)
          tag="fw-$(date -u +%Y%m%d-%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          cp "$hex" "UniSolder-firmware-$tag.hex"
          gh release create "$tag" "UniSolder-firmware-$tag.hex" \
            --title "Firmware $tag" \
            --notes "Firmware built from commit $GITHUB_SHA on ${GITHUB_REF_NAME}. Flash the .hex with the UniSolder Windows application. Changes are listed in CHANGELOG.md." \
            --target "$GITHUB_SHA"
