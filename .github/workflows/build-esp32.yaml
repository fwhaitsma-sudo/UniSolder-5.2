name: Build ESP32 Bluetooth bridge
on:
  workflow_dispatch:
  push:
    branches: [remote-control]
    paths:
      - 'software/esp32/**'
      - '.github/workflows/build-esp32.yaml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli and the ESP32 core
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --export-binaries software/esp32/UniSolderBridge
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=software/esp32/UniSolderBridge/build/esp32.esp32.esp32
          tag="esp-$(date -u +%Y%m%d-%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          cp "$dir/UniSolderBridge.ino.merged.bin" "UniSolder-ESP32-bridge-$tag.bin"
          # builds of other branches than the default one are marked as pre-release
          pre=""
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then pre="--prerelease"; fi
          gh release create "$tag" "UniSolder-ESP32-bridge-$tag.bin" $pre \
            --title "ESP32 bridge $tag" \
            --notes "Flash this single .bin at address 0x0 (for example with https://espressif.github.io/esptool-js/ in Chrome, or esptool.py write_flash 0x0 file.bin)." \
            --target "$GITHUB_SHA"
